[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hazarot-subst"
version = "0.1.0"
description = "Substitution planner for book questions → candidate questions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
]
authors = [{ name = "KIDUM" }]
license = { text = "MIT" }
keywords = ["education", "substitution", "csv", "assessment"]

[project.urls]
Homepage = "https://github.com/tomermaas/hazarot"
Repository = "https://github.com/tomermaas/hazarot"
Issues = "https://github.com/tomermaas/hazarot/issues"

[project.scripts]
haz-subst = "hazarot_subst.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hazarot_subst"]
